pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{js,jsx,ts,tsx,mjs,mts,cjs,cts}"
      run: pnpm exec eslint --max-warnings=0 {staged_files}

    - name: prettier
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
